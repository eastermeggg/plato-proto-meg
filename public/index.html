<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Design light-only : on désactive l'auto-dark du navigateur/OS. Sans ça,
         en dark mode l'auto-dark inverse les fonds sombres (boutons primaires /
         primaires surélevés) en fonds clairs tout en gardant le texte blanc =
         libellés invisibles. color-scheme: light force le rendu tel que dessiné. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E8713A" />
    <meta
      name="description"
      content="Plato — l'assistant dédié à l'évaluation du préjudice corporel. Extraction automatique des pièces, chiffrage assisté et recherche de jurisprudence."
    />
    <meta property="og:title" content="Plato - Proto" />
    <meta property="og:description" content="L'assistant dédié à l'évaluation du préjudice corporel. Extraction automatique des pièces, chiffrage assisté et recherche de jurisprudence." />
    <meta property="og:image" content="%PUBLIC_URL%/favicon.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Plato - Proto" />
    <meta name="twitter:description" content="L'assistant dédié à l'évaluation du préjudice corporel. Extraction automatique des pièces, chiffrage assisté et recherche de jurisprudence." />
    <meta name="twitter:image" content="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Plato - Proto</title>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
