# Flag changelog sur chaque PR (conventions §10) : un seul commentaire, mis à jour à chaque push.
name: ds-changelog
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  flag:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Générer le flag
        run: |
          echo '<!-- ds-changelog -->' > flag.md
          node scripts/ds-changelog.mjs --pr --base "origin/${{ github.base_ref }}" --days 15 --md >> flag.md
          cat flag.md
      - name: Publier ou mettre à jour le commentaire
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          PR=${{ github.event.pull_request.number }}
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                --jq '.[] | select(.body | startswith("<!-- ds-changelog -->")) | .id' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@flag.md
          else
            gh pr comment "$PR" --body-file flag.md
          fi
